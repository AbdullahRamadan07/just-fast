# Local development stack: MySQL + Spring Boot API + Angular (nginx) on one origin.
#   cp .env.example .env   # adjust if needed
#   docker compose up --build
#   open http://localhost:8080
name: just-fast

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: justfast
      MYSQL_USER: ${DB_USERNAME:-justfast}
      MYSQL_PASSWORD: ${DB_PASSWORD:-justfast}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root-dev-only}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    ports:
      # Host port 3307 avoids clashing with a locally installed MySQL on 3306.
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/justfast?serverTimezone=UTC
      DB_USERNAME: ${DB_USERNAME:-justfast}
      DB_PASSWORD: ${DB_PASSWORD:-justfast}
      # Plain HTTP on localhost: the session cookie cannot be "Secure" here. Always true behind HTTPS.
      COOKIE_SECURE: "false"
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@justfast.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-admin}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-sandbox}
      SANDBOX_WEBHOOK_SECRET: ${SANDBOX_WEBHOOK_SECRET:-local-sandbox-secret-change-me}
      STRIPE_API_KEY: ${STRIPE_API_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STORE_CURRENCY: ${STORE_CURRENCY:-USD}
      STORE_SHIPPING_COUNTRY: ${STORE_SHIPPING_COUNTRY:-US}
      STORE_SHIPPING_FEE: ${STORE_SHIPPING_FEE:-5.00}
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /actuator/health/readiness HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q UP <&3'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      API_UPSTREAM: http://backend:8080
    ports:
      - "8080:8080"

volumes:
  mysql-data:
