# Development cluster: in-cluster MySQL on a persistent volume, sandbox payments, single API replica
# (the built-in sandbox provider keeps sessions in memory).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: just-fast

resources:
  - ../../base
  - mysql.yaml

secretGenerator:
  - name: just-fast-secrets
    envs:
      - secrets.env # copy secrets.env.example → secrets.env (git-ignored)
    options:
      labels:
        app.kubernetes.io/component: platform

patches:
  - target:
      kind: ConfigMap
      name: just-fast-config
    patch: |-
      - op: replace
        path: /data/PUBLIC_BASE_URL
        value: https://shop.dev.example.com
      - op: replace
        path: /data/PAYMENT_PROVIDER
        value: sandbox
      - op: add
        path: /data/SANDBOX_WEBHOOK_URL
        value: http://localhost:8080/api/payments/webhooks/sandbox
  - target:
      kind: Deployment
      name: backend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: frontend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Ingress
      name: just-fast
    patch: |-
      - op: replace
        path: /spec/tls/0/hosts/0
        value: shop.dev.example.com
      - op: replace
        path: /spec/rules/0/host
        value: shop.dev.example.com
